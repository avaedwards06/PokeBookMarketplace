<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Pokebook Marketplace</title>

  <!-- Font for titles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a href="main.html">
      <img src="images/pokemon_title.png" alt="Pokebook Marketplace" class="logo">
    </a>

    <h1 class="page-title">Cart</h1>

    <a href="cart.html" class="cart-button">
      <img src="images/cart_icon.png" alt="Cart">
    </a>
  </header>

  <main class="page">
    <a href="main.html" class="back-link">&larr; Keep shopping</a>

    <p id="empty-message" class="status" hidden>Your cart is empty.</p>

    <div id="cart-list" class="cart-list"></div>

    <!-- the total and checkout -->
    <div id="cart-summary" class="cart-summary" hidden>
      <p class="cart-total">Total: <span id="cart-total">$0.00</span></p>
      <button id="checkout-button" class="checkout-button">Checkout</button>
      <p id="checkout-message" class="status" hidden></p>
    </div>
  </main>

  <!-- the storage comes before the cart since it needs to store first! -->
  <script src="js/cart-storage.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
