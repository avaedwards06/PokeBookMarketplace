<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokebook Marketplace</title>

  <!-- Fonts for market titles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top bar (includes logo) -->
<header class="site-header">
    <a href="main.html">
        <img src="images/pokemon_title.png" alt="Pokebook Marketplace" class="logo">
    </a>

    <h1 class="page-title">Main Page</h1>

    <a href="cart.html" class="cart-button">
        <img src="images/cart_icon.png" alt="Cart">
    </a>
</header>

  <!-- Page column -->
  <main class="page">
    <!-- for main.js -->
    <section id="market-grid" class="market-grid"></section>
  </main>

  <script src="js/main.js"></script>
  <!-- DO NOT WORRY. I plan on making the dropdown menu work with CSS and JS.
  I just wanted to get the HTML structure down first.

  I put this section inside a comment for now since it's the same functionality as the buttons
  above. (- ash)

  <div class="controlStrip">
    <h3>Welcome to PokeBook Marketplace!</h3>
    <dropdown id="accountStuff">
      <button onclick="profile()">Profile</button>
      <button onclick="settings()">Settings</button>
    </dropdown>
    <dropdown id="viewBy">
      <p>View By:</p>
      <button onclick="market()">Market</button>
      <button onclick="vendor()">Vendor</button>
      <button onclick="product()">Product</button>
    </dropdown>
    <button onclick="cart()">Cart</button>
    <button onclick="logout()">Logout</button>
  </div>
  <div class="marketplace">
    <button onclick="clothesMarket()">Clothes</button>
    <button onclick="plushieMarket()">Plushie</button>
    <button onclick="fanartMarket()">FanArt</button>
    <button onclick="cardMarket()">Card</button>
  </div>
</body>
</html>
