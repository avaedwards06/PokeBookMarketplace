<!DOCTYPE html>
<html lang="en">
  <head>
      <link rel="stylesheet" href="css/style.css">
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Pokebook Login</title>
  </head>
  <body class="login">
    <div class="login-container">
        <h1 id="welcome">Welcome to Pokebook Marketplace!</h1>

        <h2>LOGIN BELOW</h2>

        <div class="input-group">
            <label for="username">USERNAME:</label>
            <input type="text" id="username" placeholder="your_username">
        </div>

        <div class="input-group">
            <label for="password">PASSWORD:</label>
            <input type="password" id="password" placeholder=" ">
        </div>

        <button type="button" onclick="submitForm()">LOG IN</button>

        <div class="divider">OR</div>

        <div class="footer">
            Don't have an account? <a href="sign-up.html">Sign up here!</a>
        </div>
    </div>
    <script src="js/index.js"></script>
  </body>
</html>
