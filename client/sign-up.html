<!DOCTYPE html>
<html lang="en">
  <head>
      <link rel="stylesheet" href="css/style.css">
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Pokebook Sign Up</title>
  </head>
  <body class="register">
    <div class="register-container">
        <h1 id="welcome">Welcome to Pokebook Marketplace!</h1>

        <h2>SIGN UP BELOW</h2>

        <div class="input-group">
            <label for="username">USERNAME:</label>
            <input type="text" id="username" placeholder="your_username">
        </div>

        <div class="input-group">
            <label for="email">EMAIL:</label>
            <input type="email" id="email" placeholder="your_email@example.com">
        </div>

        <div class="input-group">
            <label for="password">PASSWORD:</label>
            <input type="password" id="password" placeholder=" ">
        </div>

        <button type="button" onclick="submitForm()">SIGN UP</button>
    </div>

        <div class="footer">
            Already have an account? <a href="index.html">Login here!</a>
        </div>

    <script src="js/index.js"></script>
  </body>
</html>
