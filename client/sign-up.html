<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Pokebook Sign Up</title>

      <!-- font for titles (same as the rest of the site) -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

      <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="register">
    <div class="register-container">

        <div class="auth-top">
            <img src="images/pokemon_title.png" alt="Pokebook Marketplace" class="auth-logo">
        </div>

        <div class="auth-stripe"><span class="auth-circle"></span></div>

        <div class="auth-body">
            <h1 id="welcome">Become a Trainer!</h1>

            <h2>Create your Pokebook account</h2>

            <form id="signupForm">
              <div class="input-group">
                  <label for="username">Username</label>
                  <input type="text" id="username" placeholder="your_username" required>
              </div>

              <div class="input-group">
                  <label for="email">Email</label>
                  <input type="email" id="email" placeholder="your_email@example.com" required>
              </div>

              <div class="input-group">
                  <label for="password">Password</label>
                  <input type="password" id="password" placeholder="************" required>
              </div>

              <div class="input-group">
                  <label for="address">Address</label>
                  <input type="text" id="address" placeholder="123 Pallet Town Rd, City, State" required>
              </div>

              <button type="submit">Sign up</button>
            </form>

            <p id="message"></p>

            <div class="divider">OR</div>

            <div class="footer">
                Already have an account? <a href="index.html">Log in here!</a>
            </div>
        </div>

    </div>
    <script src="js/index.js"></script>
  </body>
</html>
